<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Bancada - Lab Digital</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <header class="login-header">
                <h2>Acesso à Bancada</h2>
            </header>

            <form id="form-login">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Ex: aluno@exemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn-login" onclick="logar(event)">Entrar</button>
            </form>

            <div class="login-footer">
                <p>Não tem uma conta? <a href="../cadastro/cadastro.html">Cadastre-se aqui</a></p>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
