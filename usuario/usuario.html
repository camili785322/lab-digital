<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Lab Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="usuario.css">
</head>
<body class="cadastro-body">

   <div class="cadastro-container">
        
        <div class="cadastro-card">
            <header class="cadastro-header">
                <h2>Criar Conta</h2>
            </header>

            <form id="form-cadastro">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome-cadastro" placeholder="Seu nome" required>
                </div>
                <div class="input-group">
                    <label>Data de nascimento</label>
                    <input type="email" id="dt_nascimento-cadastro" placeholder="dd/aa/yyy" required>
                </div>


                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email-cadastro" placeholder="aluno@exemplo.com" required>
                </div>
                
            
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha-cadastro" placeholder="Crie uma senha" required>
                </div>

                 <div class="input-group">
                    <label for="tipo-usuario">Tipo de Usuário</label>
                    <select id="tipo-usuario" required>
                    <option value="" disabled selected>Selecione uma opção</option>
                    <option value="professor">Professor</option>
                     <option value="aluno">Aluno</option>
    </select>
</div>
                <button type="submit" class="btn-cadastro">Finalizar Cadastro</button>
                
            </form>


        <div class="lista-usuarios-card">
            <header class="lista-header">
                <h3>Usuários Cadastrados</h3>
            </header>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                        </tr>
                    </thead>
                    <tbody id="corpo-tabela">

                        </tbody>

                </table>
            </div>
        </div>
            <button type="submit" class="btn-cadastro">Excluir Usuario</button>
    </div>

    <script src="usuario.js"></script>
</body>
</html>
